server {
    # Port 5174 to match the dev server, so the URL is the same either way.
    # nginx binds 0.0.0.0 here, so the published port answers on both the IPv4
    # and IPv6 loopback -- the IPv6-only bind that broke Chrome cannot recur.
    listen 5174;
    listen [::]:5174;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are safe to cache hard; index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
